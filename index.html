<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<title>Ctrl_CMD</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:Consolas,"Courier New",monospace;
}
body{overflow:hidden}
#app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:#000;
}
#titlebar{
    height:38px;
    min-height:38px;
    display:flex;
    align-items:center;
    padding:0 12px;
    background:#111;
    border-bottom:1px solid #333;
    color:#ddd;
    font-family:"Segoe UI",Arial,sans-serif;
    font-size:13px;
    font-weight:600;
}
#terminal{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:12px 14px 20px;
    font-size:19px;
    line-height:1.45;
    font-weight:700;
    white-space:pre-wrap;
    word-break:break-word;
    cursor:text;
}
.line{margin:0}
.command{color:#fff}
#inputArea{
    display:flex;
    align-items:center;
    padding:0 14px 14px;
    background:#000;
}
#prompt{
    flex:0 0 auto;
    color:#fff;
    font-size:16px;
    line-height:1.45;
    font-weight:700;
    white-space:pre;
}
#commandInput{
    flex:1;
    min-width:0;
    border:0;
    outline:0;
    background:transparent;
    color:#fff;
    font-family:Consolas,"Courier New",monospace;
    font-size:16px;
    line-height:1.45;
    font-weight:700;
    padding:0;
    caret-color:#fff;
}
@media(max-width:600px){
    #terminal,#commandInput,#prompt{
        font-size:18px;
    }
}
</style>
</head>

<body>
<div id="app">
    <div id="titlebar">Ctrl_CMD</div>
    <main id="terminal"></main>
    <div id="inputArea">
        <span id="prompt"></span>
        <input id="commandInput" type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false">
    </div>
</div>

<script>
const terminal=document.getElementById("terminal");
const input=document.getElementById("commandInput");
const prompt=document.getElementById("prompt");

let currentPath="C:\\Users\\User";
let history=[];
let historyIndex=-1;

const folders={
    "C:\\Users\\User":[
        ["09/28/2026","10:21 AM","<DIR>","Desktop"],
        ["09/28/2026","10:21 AM","<DIR>","Documents"],
        ["09/28/2026","10:21 AM","<DIR>","Downloads"],
        ["09/28/2026","10:21 AM","<DIR>","Pictures"],
        ["09/28/2026","10:21 AM","<DIR>","Music"],
        ["09/28/2026","10:21 AM","<DIR>","Videos"],
        ["09/28/2026","10:22 AM","         ","notes.txt"]
    ],
    "C:\\Users\\User\\Desktop":[],
    "C:\\Users\\User\\Documents":[],
    "C:\\Users\\User\\Downloads":[],
    "C:\\Users\\User\\Pictures":[],
    "C:\\Users\\User\\Music":[],
    "C:\\Users\\User\\Videos":[]
};

function updatePrompt(){
    prompt.textContent=currentPath+">";
}

function print(text=""){
    const line=document.createElement("div");
    line.className="line";
    line.textContent=text;
    terminal.appendChild(line);
    terminal.scrollTop=terminal.scrollHeight;
}

function boot(){
    print("Microsoft Windows [Version 10.0.26100.1]");
    print("(c) Microsoft Corporation. All rights reserved.");
    print("");
    updatePrompt();
}

function normalizePath(path){
    path=path.replaceAll("/","\\").replace(/\\+/g,"\\");
    if(path.length>3) path=path.replace(/\\$/,"");
    return path;
}

function resolvePath(target){
    target=target.trim().replace(/^["']|["']$/g,"");
    if(!target) return currentPath;

    if(/^[A-Za-z]:\\/.test(target) || /^[A-Za-z]:$/.test(target)){
        return normalizePath(target);
    }

    if(target==="\\") return "C:\\";
    if(target==="." || target==="") return currentPath;

    let parts=currentPath.split("\\");
    const targetParts=target.split("\\").filter(Boolean);

    for(const part of targetParts){
        if(part===".") continue;
        if(part===".."){
            if(parts.length>1) parts.pop();
        }else{
            parts.push(part);
        }
    }

    return normalizePath(parts.join("\\"));
}

function commandDir(){
    print("");
    print(" Directory of "+currentPath);
    print("");
    const entries=folders[currentPath];

    if(!entries){
        print("File Not Found");
        print("");
        return;
    }

    for(const e of entries){
        print(e[0]+"  "+e[1]+"    "+e[2]+"    "+e[3]);
    }

    print("");
    const dirs=entries.filter(e=>e[2]==="<DIR>").length;
    const files=entries.length-dirs;
    print("               "+files+" File(s)");
    print("               "+dirs+" Dir(s)");
    print("");
}

function commandHelp(){
    print("");
    print("For more information on a specific command, type HELP command-name.");
    print("");
    print("CD       Displays or changes the current directory.");
    print("CLS      Clears the screen.");
    print("DATE     Displays or sets the date.");
    print("DIR      Displays a list of files and subdirectories.");
    print("ECHO     Displays messages.");
    print("HELP     Provides Help information for Windows commands.");
    print("TIME     Displays or sets the system time.");
    print("VER      Displays the Windows version.");
    print("WHOAMI   Displays the current user.");
    print("HOSTNAME Displays the computer name.");
    print("");
}

function execute(raw){
    const command=raw.trim();
    if(!command) return;

    print(currentPath+">"+raw);

    history.push(raw);
    historyIndex=history.length;

    const firstSpace=command.indexOf(" ");
    const name=(firstSpace===-1?command:command.slice(0,firstSpace)).toLowerCase();
    const args=firstSpace===-1?"":command.slice(firstSpace+1);

    switch(name){

        case "help":
            commandHelp();
            break;

        case "cls":
        case "clear":
            terminal.innerHTML="";
            break;

        case "dir":
            commandDir();
            break;

        case "cd":
            if(!args){
                print(currentPath);
                print("");
                break;
            }
            const newPath=resolvePath(args);
            if(folders[newPath]){
                currentPath=newPath;
            }else{
                print("The system cannot find the path specified.");
            }
            print("");
            break;

        case "echo":
            print(args);
            break;

        case "ver":
            print("");
            print("Microsoft Windows [Version 10.0.26100.1]");
            print("");
            break;

        case "whoami":
            print("desktop\\user");
            print("");
            break;

        case "hostname":
            print("CTRL-PC");
            print("");
            break;

        case "date":
            print("The current date is: 09/28/2026");
            print("");
            break;

        case "time":
            print("The current time is: "+new Date().toLocaleTimeString("en-US",{hour:"2-digit",minute:"2-digit",second:"2-digit"}));
            print("");
            break;

        case "color":
            print("Color command is simulated by Ctrl_CMD.");
            print("");
            break;

        default:
            print("'+raw+' is not recognized as an internal or external command,");
            print("operable program or batch file.");
            print("");
            break;
    }

    updatePrompt();
}

input.addEventListener("keydown",event=>{
    if(event.key==="Enter"){
        const raw=input.value;
        input.value="";
        execute(raw);
    }

    if(event.key==="ArrowUp"){
        if(!history.length)return;
        event.preventDefault();
        historyIndex=Math.max(0,historyIndex-1);
        input.value=history[historyIndex]||"";
    }

    if(event.key==="ArrowDown"){
        if(!history.length)return;
        event.preventDefault();
        historyIndex=Math.min(history.length,historyIndex+1);
        input.value=history[historyIndex]||"";
    }

    if(event.key==="Tab"){
        event.preventDefault();
        const value=input.value.toLowerCase();
        const names=["help","cls","clear","dir","cd","echo","ver","whoami","hostname","date","time","color"];
        const match=names.find(n=>n.startsWith(value));
        if(match) input.value=match;
    }

    if(event.ctrlKey && event.key.toLowerCase()==="c"){
        input.value="";
        print("^C");
        updatePrompt();
    }
});

terminal.addEventListener("click",()=>input.focus());
document.addEventListener("click",()=>input.focus());

if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./sw.js").catch(console.error);
    });
}

boot();
input.focus();
</script>
</body>
</html>
