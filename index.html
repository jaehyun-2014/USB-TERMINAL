<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#050505">

<title>USB-CMD</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #050505;
    color: #eeeeee;
    font-family: Consolas, "Courier New", monospace;
    font-weight: 700;
}

body {
    overflow: hidden;
}

#app {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #050505;
}

/* HEADER */

#header {
    height: 72px;
    min-height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 2px solid #202020;
    background: #080808;
}

#logo {
    font-size: 29px;
    font-weight: 900;
    letter-spacing: 1px;
}

#logoUSB {
    color: #39ff14;
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.5);
}

#logoCMD {
    color: #ffffff;
}

#platform {
    color: #888888;
    font-size: 15px;
    font-weight: 900;
}

/* TERMINAL */

#terminal {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    font-size: 17px;
    line-height: 1.65;
    font-weight: 700;
    white-space: pre-wrap;
    word-break: break-word;
}

.line {
    margin-bottom: 4px;
}

.system {
    color: #aaaaaa;
}

.command {
    color: #ffffff;
}

.success {
    color: #39ff14;
}

.warning {
    color: #ffd84d;
}

/* INPUT */

#inputArea {
    display: flex;
    align-items: center;
    min-height: 62px;
    padding: 10px 16px;
    border-top: 2px solid #202020;
    background: #080808;
}

#prompt {
    color: #39ff14;
    font-size: 18px;
    font-weight: 900;
    margin-right: 8px;
}

#commandInput {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: #ffffff;
    font-family: Consolas, "Courier New", monospace;
    font-size: 18px;
    font-weight: 800;
}

#commandInput::placeholder {
    color: #555555;
}

/* INSTALL */

#installButton {
    position: fixed;
    right: 16px;
    bottom: 78px;
    display: none;
    padding: 11px 15px;
    border: 1px solid #39ff14;
    border-radius: 6px;
    background: #0b0b0b;
    color: #39ff14;
    font-family: Consolas, monospace;
    font-size: 14px;
    font-weight: 900;
    cursor: pointer;
}

#installButton:hover {
    background: #121212;
}

@media (max-width: 600px) {

    #header {
        height: 64px;
        min-height: 64px;
        padding: 0 15px;
    }

    #logo {
        font-size: 24px;
    }

    #platform {
        font-size: 13px;
    }

    #terminal {
        padding: 16px;
        font-size: 16px;
        line-height: 1.6;
    }

    #inputArea {
        min-height: 60px;
        padding: 9px 12px;
    }

    #prompt,
    #commandInput {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div id="app">

    <header id="header">

        <div id="logo">
            <span id="logoUSB">USB</span><span id="logoCMD">-CMD</span>
        </div>

        <div id="platform">
            ANDROID
        </div>

    </header>

    <main id="terminal"></main>

    <div id="inputArea">

        <span id="prompt">CMD&gt;</span>

        <input
            id="commandInput"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            autofocus
        >

    </div>

</div>

<button id="installButton">INSTALL USB-CMD</button>

<script>

const terminal = document.getElementById("terminal");
const input = document.getElementById("commandInput");
const installButton = document.getElementById("installButton");

let history = [];
let historyIndex = -1;


/* 출력 */

function print(text = "", type = "") {

    const line = document.createElement("div");

    line.className = "line " + type;
    line.textContent = text;

    terminal.appendChild(line);

    terminal.scrollTop = terminal.scrollHeight;
}


/* 시작 화면 */

function boot() {

    print("USB-CMD", "success");
    print("USB COMMAND TERMINAL");
    print("ANDROID EDITION");
    print("");
    print("Type 'help' to view available commands.", "system");
    print("");

}


/* 명령어 실행 */

function execute(command) {

    const cmd = command.trim().toLowerCase();

    if (!cmd) {
        return;
    }

    print("CMD> " + command, "command");

    history.push(command);
    historyIndex = history.length;


    switch (cmd) {


        case "help":

            print("");
            print("AVAILABLE COMMANDS", "success");
            print("");
            print("help     - Show available commands");
            print("clear    - Clear terminal");
            print("version  - Show USB-CMD version");
            print("status   - Show terminal status");
            print("usb      - Show USB information");
            print("sui      - Fun command");
            print("");

            break;


        case "clear":

            terminal.innerHTML = "";

            break;


        case "version":

            print("");
            print("USB-CMD");
            print("Android PWA Edition");
            print("Version 1.0");
            print("USB COMMAND TERMINAL");
            print("");

            break;


        case "status":

            print("");
            print("SYSTEM STATUS", "success");
            print("");
            print("Terminal : ONLINE");
            print("Platform : ANDROID");
            print("PWA      : ACTIVE");
            print("USB-CMD  : READY");
            print("");

            break;


        case "usb":

            print("");
            print("USB STATUS", "success");
            print("");
            print("USB OTG      : BROWSER ACCESS");
            print("USB CONTROL  : LIMITED");
            print("");
            print("Direct system-level USB control");
            print("is not available from this PWA.");
            print("");

            break;


        /*
         * 유일하게 SUI가 등장하는 명령어
         */

        case "sui":

            print("");
            print("SUI");
            print("");

            break;


        default:

            print("");
            print("Unknown command: " + command, "warning");
            print("Type 'help' for available commands.");
            print("");

            break;

    }

}


/* 키보드 */

input.addEventListener("keydown", function(event) {


    if (event.key === "Enter") {

        const command = input.value;

        input.value = "";

        execute(command);

    }


    else if (event.key === "ArrowUp") {

        if (history.length === 0) {
            return;
        }

        event.preventDefault();

        historyIndex--;

        if (historyIndex < 0) {
            historyIndex = 0;
        }

        input.value = history[historyIndex] || "";

    }


    else if (event.key === "ArrowDown") {

        if (history.length === 0) {
            return;
        }

        event.preventDefault();

        historyIndex++;

        if (historyIndex >= history.length) {

            historyIndex = history.length;

            input.value = "";

        }

        else {

            input.value = history[historyIndex];

        }

    }

});


/* 화면 클릭하면 입력창 활성화 */

document.addEventListener("click", function() {

    input.focus();

});


/* PWA 설치 */

let deferredPrompt = null;


window.addEventListener("beforeinstallprompt", function(event) {

    event.preventDefault();

    deferredPrompt = event;

    installButton.style.display = "block";

});


installButton.addEventListener("click", async function() {

    if (!deferredPrompt) {
        return;
    }

    deferredPrompt.prompt();

    await deferredPrompt.userChoice;

    deferredPrompt = null;

    installButton.style.display = "none";

});


/* Service Worker */

if ("serviceWorker" in navigator) {

    window.addEventListener("load", function() {

        navigator.serviceWorker
            .register("./sw.js")
            .catch(function(error) {

                console.log(
                    "Service Worker registration failed:",
                    error
                );

            });

    });

}


boot();

</script>

</body>
</html>
